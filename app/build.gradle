plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dicema.comandaprint'
    compileSdk 34

    defaultConfig {
        applicationId "com.dicema.comandaprint"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "3.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
