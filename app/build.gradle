plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dicema.comandaprint'
    compileSdk 34

    defaultConfig {
        applicationId "com.dicema.comandaprint"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "3.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
